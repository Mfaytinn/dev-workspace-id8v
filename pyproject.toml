[project]
name = "ncam"
version = "0.1.0"
description = "Anonymous reproduction package for Neural Conjugate Aggregation"
requires-python = ">=3.13"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.4.2",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "pyyaml==6.0.3",
    "scikit-learn==1.8.0",
    "scipy==1.18.1",
    "tabulate==0.9.0",
    "torch==2.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncam", "paper_reproduce"]

[tool.hatch.build.targets.wheel.force-include]
"third_party/veli" = "third_party/veli"

[dependency-groups]
dev = ["ruff==0.15.0"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
